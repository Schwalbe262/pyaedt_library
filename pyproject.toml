[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyaedt-library"
version = "0.1.0"
description = "Common PyAEDT helper library"
requires-python = ">=3.10"
dependencies = [
  "pyaedt>=1.0.1,<2",
  "pyedb",
  "ansys-pythonnet",
  "clr_loader",
  "grpcio",
  "rpyc",
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "filelock",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
